<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-gray-500 text-sm">Total Items</p>
                <p id="total-items" class="text-2xl font-bold text-gray-800">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-gray-500 text-sm">Total Value</p>
                <p id="total-value" class="text-2xl font-bold text-blue-600">Ksh 0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-gray-500 text-sm">Low Stock</p>
                <p id="low-stock" class="text-2xl font-bold text-red-500">0</p>
            </div>
        </div>

        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-4xl font-bold text-gray-800">My Inventory</h1>
            <div class="text-sm text-gray-500 flex items-center gap-2">
                <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">Online</span>
                Inventory Management Project
            </div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Add New Item Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800 flex items-center gap-2">
                    <span>Add New Item</span>
                </h2>
                <form id="addForm" class="space-y-5">
                    <input type="text" id="name" placeholder="Item Name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="quantity" placeholder="Quantity" value="1"
                               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <input type="number" id="price" placeholder="Price (Ksh)" step="0.01"
                               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 rounded-xl transition duration-200">
                        Add to Inventory
                    </button>
                </form>
            </div>

            <!-- Search Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800">Search OpenFoodFacts</h2>
                <form id="searchForm" class="space-y-4">
                    <input type="text" id="searchQuery" placeholder="Enter product name or barcode" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                    <button type="submit" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3.5 rounded-xl transition duration-200">
                        Search Product
                    </button>
                </form>
                <div id="searchResult" class="mt-5 min-h-[60px]"></div>
            </div>
        </div>

        <!-- Local Search -->
        <div class="mt-10 mb-4">
            <input type="text" id="localSearch" placeholder="Search your inventory..." 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>

        <!-- Inventory Section -->
        <div class="mt-12">
            <h2 class="text-2xl font-semibold mb-6 text-gray-800">Current Inventory</h2>
            <div id="inventory-list" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                Loading items...
            </div>
        </div>

        <!--  My Footer -->
        <footer class="mt-16 text-center text-gray-500 text-sm">
            Inventory Management System • Built with Flask & Tailwind • Favour Kendi
        </footer>
    </div>
<script src="/static/js/script.js"></script>
</body>
</html>
