<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <h1 class="text-4xl font-bold text-gray-800 mb-8 text-center">My Inventory Management System</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Add New Item Card -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-2xl font-semibold mb-4 text-gray-700">Add New Item</h2>
                <form id="addForm" class="space-y-4">
                    <input type="text" id="name" placeholder="Item Name" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="quantity" placeholder="Quantity" value="1"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <input type="number" id="price" placeholder="Price" step="0.01"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition">
                        Add Item
                    </button>
                </form>
            </div>

            <!-- Search Card -->
            <div class="bg-white p-6 rounded-xl shadow">
                <h2 class="text-2xl font-semibold mb-4 text-gray-700">Search from OpenFoodFacts</h2>
                <form id="searchForm" class="space-y-4">
                    <input type="text" id="searchQuery" placeholder="Enter product name or barcode" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <button type="submit" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition">
                        Search Product
                    </button>
                </form>
                <div id="searchResult" class="mt-4"></div>
            </div>
        </div>

        <!-- Inventory Section -->
        <div class="mt-10">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Current Inventory</h2>
            <div id="inventory-list" class="bg-white rounded-xl shadow p-4">
                Loading items...
            </div>
        </div>
    </div>

    <script>
        // My JavaScript to load inventory from backend
        async function loadInventory() {
            const response = await fetch('/items');
            const data = await response.json();
            const container = document.getElementById('inventory-list');
            
            if (data.items && data.items.length === 0) {
                container.innerHTML = "<p class='text-gray-500 text-center py-8'>No items in inventory yet.</p>";
                return;
            }

            let html = `
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="px-4 py-3 text-left">ID</th>
                            <th class="px-4 py-3 text-left">Name</th>
                            <th class="px-4 py-3 text-left">Quantity</th>
                            <th class="px-4 py-3 text-left">Price</th>
                            <th class="px-4 py-3 text-left">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            data.items.forEach(item => {
                html += `
                    <tr class="border-t">
                        <td class="px-4 py-3">${item.id}</td>
                        <td class="px-4 py-3 font-medium">${item.name}</td>
                        <td class="px-4 py-3">${item.quantity}</td>
                        <td class="px-4 py-3">Ksh ${item.price}</td>
                        <td class="px-4 py-3">
                            <button onclick="deleteItem(${item.id})" 
                                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded text-sm">
                                Delete
                            </button>
                        </td>
                    </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // My code to add new item from the form
        document.getElementById('addForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const quantity = document.getElementById('quantity').value || 1;
            const price = document.getElementById('price').value || 0;

            const response = await fetch('/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    quantity: parseInt(quantity),
                    price: parseFloat(price)
                })
            });

            const result = await response.json();
            alert(result.message || "Item added successfully!");
            
            document.getElementById('addForm').reset();
            loadInventory();
        });

        // My code to search OpenFoodFacts
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const query = document.getElementById('searchQuery').value.trim();
            const resultDiv = document.getElementById('searchResult');
            
            if (!query) return;

            const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <div class="bg-green-50 p-4 rounded-lg">
                        <p class="font-medium">Found: ${data.product.name}</p>
                        <button onclick="addFromExternal('${data.product.barcode || query}')" 
                                class="mt-3 bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg text-sm">
                            Add to My Inventory
                        </button>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<p class="text-red-600">${data.error}</p>`;
            }
        });

        // Add from external search result
        async function addFromExternal(barcode) {
            const response = await fetch('/items/from-external', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcode: barcode, quantity: 1 })
            });
            const result = await response.json();
            alert(result.message);
            loadInventory();
            document.getElementById('searchResult').innerHTML = '';
        }

        // My code to delete an item
        async function deleteItem(id) {
            if (!confirm("Are you sure you want to delete this item?")) return;
            
            const response = await fetch(`/items/${id}`, {
                method: 'DELETE'
            });
            
            const result = await response.json();
            alert(result.message);
            loadInventory();
        }

        // Load inventory when page opens
        window.onload = loadInventory;
    </script>
</body>
</html>
