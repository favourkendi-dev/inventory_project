<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Inventory System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 5px; }
        input, button { margin: 5px; padding: 8px; }
    </style>
</head>
<body>
    <h1>My Inventory Management System</h1>
    
    <h2>Add New Item</h2>
    <!-- I added this form to add new items manually -->
    <form id="addForm">
        <input type="text" id="name" placeholder="Item Name" required>
        <input type="number" id="quantity" placeholder="Quantity" value="1">
        <input type="number" id="price" placeholder="Price" step="0.01">
        <button type="submit">Add Item</button>
    </form>

    <h2>Search Product from OpenFoodFacts</h2>
    <!-- I added this section to search external products -->
    <form id="searchForm">
        <input type="text" id="searchQuery" placeholder="Enter product name or barcode" style="width:300px;">
        <button type="submit">Search</button>
    </form>

    <div id="searchResult"></div>

    <h2>Current Inventory</h2>
    <div id="inventory-list">
        Loading items...
    </div>

    <script>
        // My JavaScript to load inventory from backend
        async function loadInventory() {
            const response = await fetch('/items');
            const data = await response.json();
            const container = document.getElementById('inventory-list');
            
            if (data.items && data.items.length === 0) {
                container.innerHTML = "<p>No items in inventory yet.</p>";
                return;
            }

            let html = '<table><tr><th>ID</th><th>Name</th><th>Quantity</th><th>Price</th><th>Actions</th></tr>';
            data.items.forEach(item => {
                html += `<tr>
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.price}</td>
                    <td><button onclick="deleteItem(${item.id})" style="background:red;color:white;">Delete</button></td>
                </tr>`;
            });
            html += '</table>';
            container.innerHTML = html;
        }

        // My code to add new item from the form
        document.getElementById('addForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const quantity = document.getElementById('quantity').value || 1;
            const price = document.getElementById('price').value || 0;

            const response = await fetch('/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    quantity: parseInt(quantity),
                    price: parseFloat(price)
                })
            });

            const result = await response.json();
            alert(result.message || "Item added successfully!");
            
            document.getElementById('addForm').reset();
            loadInventory();
        });

        // My code to search OpenFoodFacts
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const query = document.getElementById('searchQuery').value.trim();
            const resultDiv = document.getElementById('searchResult');
            
            if (!query) return;

            const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <p><strong>Found:</strong> ${data.product.name}</p>
                    <button onclick="addFromExternal('${data.product.barcode || query}')">Add to My Inventory</button>
                `;
            } else {
                resultDiv.innerHTML = `<p style="color:red;">${data.error}</p>`;
            }
        });

        // Add from external search result
        async function addFromExternal(barcode) {
            const response = await fetch('/items/from-external', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ barcode: barcode, quantity: 1 })
            });
            const result = await response.json();
            alert(result.message);
            loadInventory();
            document.getElementById('searchResult').innerHTML = '';
        }

        // My code to delete an item
        async function deleteItem(id) {
            if (!confirm("Are you sure you want to delete this item?")) return;
            
            const response = await fetch(`/items/${id}`, {
                method: 'DELETE'
            });
            
            const result = await response.json();
            alert(result.message);
            loadInventory();
        }

        // Load inventory when page opens
        window.onload = loadInventory;
    </script>
</body>
</html>
