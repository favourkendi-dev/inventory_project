<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">Create Account</h1>
        <p class="text-gray-500 text-center mb-8">Register to manage your inventory</p>
        
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="regUsername" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="regPassword" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <button type="submit" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3.5 rounded-xl transition duration-200">
                Register
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-500">
            Already have an account? 
            <a href="/login" class="text-green-600 hover:underline">Login</a>
        </p>
    </div>
</body>
</html>
