{% extends "base.html" %}

{% block title %}Login My Inventory{% endblock %}

{% block content %}
    <div class="flex items-center justify-center min-h-[70vh]">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">Welcome Back</h1>
            <p class="text-gray-500 text-center mb-8">Login to your inventory</p>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="loginUsername" required
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required 
                           class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <button type="submit" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3.5 rounded-xl transition duration-200">
                    Login
                </button>
            </form>
            
            <p class="text-center mt-6 text-gray-500">
                Don't have an account? 
                <a href="/register" class="text-green-600 hover:underline">Register</a>
            </p>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/auth.js"></script>
{% endblock %}
